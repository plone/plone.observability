---
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      - name: Install docs dependencies
        working-directory: docs
        run: |
          uv venv .venv
          uv pip install sphinx sphinx-autobuild \
            myst_parser sphinxcontrib.mermaid shibuya \
            sphinx-design sphinx-copybutton

      - name: Check prose
        working-directory: docs
        run: find sources -name '*.md' -print0 | xargs -0 bash check-prose.sh

      - name: Build documentation
        working-directory: docs
        run: .venv/bin/sphinx-build -W --keep-going sources html

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
